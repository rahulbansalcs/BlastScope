services:
  - type: web
    name: blastscope-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.init_db && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_JOB_QUEUE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: blastscope-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REPOSITORY_SIZE_MB
        value: "100"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "900"
      - key: GIT_CLONE_DEPTH
        value: "50"
  - type: web
    name: blastscope-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
databases:
  - name: blastscope-db
    plan: free
    databaseName: blastscope
    user: blastscope