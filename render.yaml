services:
  - type: web
    name: blastscope-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.db.init_db
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blastscope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blastscope-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_REPOSITORY_SIZE_MB
        value: "200"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "1800"
      - key: GIT_CLONE_DEPTH
        value: "100"
  - type: worker
    name: blastscope-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blastscope-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blastscope-redis
          property: connectionString
      - key: MAX_REPOSITORY_SIZE_MB
        value: "200"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "1800"
      - key: GIT_CLONE_DEPTH
        value: "100"
  - type: keyvalue
    name: blastscope-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: web
    name: blastscope-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
databases:
  - name: blastscope-db
    plan: basic-256mb
    databaseName: blastscope
    user: blastscope